name: Release

on:
  push:
    tags:
      - "v*-alpha.*"

permissions:
  contents: write
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    environment: npm
    steps:
      - name: Checkout including Whisper model
        uses: actions/checkout@v4
        with:
          lfs: true

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.7.0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
          cache: pnpm

      - name: Install workspace dependencies
        run: pnpm install --frozen-lockfile

      - name: Check tag and package version
        run: >-
          node -e "const p=require('./packages/dsh/package.json');
          if(process.env.GITHUB_REF_NAME!=='v'+p.version)
          throw new Error('tag '+process.env.GITHUB_REF_NAME+' does not match @flowboard/dsh '+p.version);
          if(!/-alpha\.\d+$/.test(p.version)) throw new Error('only alpha versions may be released')"

      - name: Install compatible DSH CLI
        run: pnpm add --global @deepseek-ai/dsh@0.1.0-rc.6

      - name: Run release checks
        run: pnpm run release:check

      - name: Generate artifact checksum
        working-directory: artifacts
        run: sha256sum flowboard-dsh-*.tgz > SHA256SUMS

      - name: Publish @flowboard/dsh Alpha with npm provenance
        run: npm publish artifacts/flowboard-dsh-*.tgz --access public --tag alpha --provenance

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          prerelease: true
          body: |
            Alpha 预览版，不承诺接口与数据结构稳定。

            npm 安装：`dsh plugin --profile web add @flowboard/dsh@alpha`

            也可以下载本 Release 的 `.tgz` 与 `SHA256SUMS`，校验后执行：
            `dsh plugin --profile web add ./flowboard-dsh-*.tgz`
          files: |
            artifacts/flowboard-dsh-*.tgz
            artifacts/SHA256SUMS
